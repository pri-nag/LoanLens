<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 760" width="1700" height="760" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .t  { font-size: 21px; font-weight: 700; fill: #0f172a; }
      .s  { font-size: 15px; fill: #334155; }
      .m  { font-family: "JetBrains Mono", Consolas, monospace; }
      .lbl{ font-size: 14px; fill: #475569; font-style: italic; }
      .ln { stroke: #475569; stroke-width: 2.2; fill: none; }
    </style>
  </defs>
  <rect width="1700" height="760" fill="#ffffff"/>
  <text x="40" y="58" font-size="30" font-weight="800" fill="#0f172a">Personal loan eligibility: data and decision pipeline</text>
  <text x="40" y="88" font-size="16" fill="#64748b">From public sources to a decision per applicant profile</text>

  <!-- Row 1 -->
  <rect x="40" y="130" width="240" height="130" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="160" y="170" text-anchor="middle" class="t">Public sources</text>
  <text x="160" y="198" text-anchor="middle" class="s">lender pages · aggregators</text>
  <text x="160" y="222" text-anchor="middle" class="s">calculators · RBI rules</text>

  <rect x="340" y="130" width="230" height="130" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="455" y="178" text-anchor="middle" class="t m">sources.csv</text>
  <text x="455" y="208" text-anchor="middle" class="s">URL · date · publisher</text>

  <rect x="630" y="130" width="270" height="130" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="765" y="170" text-anchor="middle" class="t m">rules_long.csv</text>
  <text x="765" y="198" text-anchor="middle" class="s">lender · rule · value</text>
  <text x="765" y="222" text-anchor="middle" class="s">source · tier · estimate?</text>

  <polygon points="1015,120 1090,195 1015,270 940,195" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1015" y="201" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">validate</text>
  <text x="1015" y="296" text-anchor="middle" class="lbl">bad row → pipeline stops</text>

  <rect x="1150" y="130" width="200" height="130" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1250" y="190" text-anchor="middle" class="t">Engine</text>
  <text x="1250" y="216" text-anchor="middle" class="s m">loan_engine</text>

  <rect x="1410" y="130" width="250" height="130" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1535" y="168" text-anchor="middle" class="t">Decision</text>
  <text x="1535" y="192" text-anchor="middle" class="t">per profile</text>
  <text x="1535" y="222" text-anchor="middle" class="s">eligible? · lenders · best</text>

  <!-- Row 1 arrows -->
  <line x1="280" y1="195" x2="336" y2="195" class="ln" marker-end="url(#arr)"/>
  <line x1="570" y1="195" x2="626" y2="195" class="ln" marker-end="url(#arr)"/>
  <line x1="900" y1="195" x2="936" y2="195" class="ln" marker-end="url(#arr)"/>
  <line x1="1090" y1="195" x2="1146" y2="195" class="ln" marker-end="url(#arr)"/>
  <line x1="1350" y1="195" x2="1406" y2="195" class="ln" marker-end="url(#arr)"/>

  <!-- Engine stages -->
  <path d="M1180,260 V620" class="ln"/>
  <g>
    <line x1="1180" y1="400" x2="1226" y2="400" class="ln" marker-end="url(#arr)"/>
    <rect x="1230" y="360" width="430" height="80" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="1250" y="393" class="t" font-size="19">A. Knock-out rules</text>
    <text x="1250" y="420" class="s">age · income · experience · score · DPD · write-off</text>
  </g>
  <g>
    <line x1="1180" y1="510" x2="1226" y2="510" class="ln" marker-end="url(#arr)"/>
    <rect x="1230" y="470" width="430" height="80" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="1250" y="503" class="t" font-size="19">B. Loan sizing</text>
    <text x="1250" y="530" class="s">FOIR · salary multiple · product cap · age-capped tenure</text>
  </g>
  <g>
    <line x1="1180" y1="620" x2="1226" y2="620" class="ln" marker-end="url(#arr)"/>
    <rect x="1230" y="580" width="430" height="80" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="1250" y="613" class="t" font-size="19">C. Pricing + ranking</text>
    <text x="1250" y="640" class="s">expected rate · APR incl. fee · best option + why</text>
  </g>

  <!-- Row 2: calibration -->
  <rect x="340" y="470" width="230" height="110" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="455" y="514" text-anchor="middle" class="t m">probes.csv</text>
  <text x="455" y="542" text-anchor="middle" class="s">calculator readings</text>

  <rect x="630" y="470" width="270" height="110" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="765" y="514" text-anchor="middle" class="t m">calibrate.py</text>
  <text x="765" y="542" text-anchor="middle" class="s">implied FOIR · multiple</text>

  <line x1="570" y1="525" x2="626" y2="525" class="ln" marker-end="url(#arr)"/>
  <line x1="765" y1="470" x2="765" y2="266" stroke="#b45309" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arrD)"/>
  <rect x="780" y="352" width="128" height="30" rx="6" fill="#fff7ed"/>
  <text x="790" y="373" font-size="16" font-weight="600" fill="#b45309">checks rules</text>

  <!-- Legend -->
  <g font-size="14" fill="#334155">
    <rect x="40" y="690" width="18" height="18" rx="4" fill="#e0f2fe" stroke="#0284c7"/><text x="66" y="704">Inputs</text>
    <rect x="140" y="690" width="18" height="18" rx="4" fill="#ccfbf1" stroke="#0d9488"/><text x="166" y="704">Data tables</text>
    <rect x="270" y="690" width="18" height="18" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="296" y="704">Code</text>
    <rect x="360" y="690" width="18" height="18" rx="4" fill="#fef3c7" stroke="#d97706"/><text x="386" y="704">Quality gate</text>
    <rect x="490" y="690" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="516" y="704">Output</text>
  </g>
</svg>
